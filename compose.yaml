services:
  relay:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RELAY_PORT:-4097}:4097"
    volumes:
      - relay-data:/data
    environment:
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "set -a; . /data/opencode-local-api/environment; node src/server.mjs --check"]
      interval: 15s
      timeout: 15s
      start_period: 5m
      retries: 3

volumes:
  relay-data:
